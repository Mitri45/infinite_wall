name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run verification suite
        run: pnpm verify
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

  build-linux:
    name: Build Linux release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux installers
        run: pnpm make -- --platform linux --arch x64
      - name: Upload Linux installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: |
            out/make/**/*.deb
            out/make/**/*.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build signed macOS ${{ matrix.arch }} release
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Developer ID signing and notarization
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY_SECRET: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "${MACOS_CERTIFICATE_P12_BASE64}"
          test -n "${MACOS_CERTIFICATE_PASSWORD}"
          test -n "${MACOS_KEYCHAIN_PASSWORD}"
          test -n "${APPLE_API_KEY_P8_BASE64}"
          test -n "${APPLE_API_KEY_ID_SECRET}"
          test -n "${APPLE_API_ISSUER_SECRET}"

          certificate_path="${RUNNER_TEMP}/infinite-wall-certificate.p12"
          keychain_path="${RUNNER_TEMP}/infinite-wall-signing.keychain-db"
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"

          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 -D > "${certificate_path}"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${api_key_path}"
          chmod 600 "${certificate_path}" "${api_key_path}"

          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${MACOS_KEYCHAIN_PASSWORD}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          {
            echo "INFINITE_WALL_MACOS_SIGNING=true"
            echo "APPLE_API_KEY_PATH=${api_key_path}"
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID_SECRET}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER_SECRET}"
            if [[ -n "${MACOS_SIGN_IDENTITY_SECRET}" ]]; then
              echo "MACOS_SIGN_IDENTITY=${MACOS_SIGN_IDENTITY_SECRET}"
            fi
          } >> "${GITHUB_ENV}"
      - name: Build signed and notarized macOS installers
        run: pnpm make -- --platform darwin --arch ${{ matrix.arch }}
      - name: Verify signed and notarized application
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find out -type d -name 'Infinite Wall.app' -print -quit)"
          test -n "${app_path}"
          helper_path="${app_path}/Contents/Resources/InfiniteWallWallpaperHelper"
          test -x "${helper_path}"
          codesign --verify --verbose=2 "${helper_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"
      - name: Upload macOS installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release installers
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Normalize release asset names
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            directory="${file%/*}"
            filename="${file##*/}"
            normalized="${filename// /.}"
            if [[ "${filename}" != "${normalized}" ]]; then
              mv -- "${file}" "${directory}/${normalized}"
            fi
          done < <(find release-artifacts -type f \( -name '*.zip' -o -name '*.dmg' \) -print0)
      - name: Create checksums
        shell: bash
        run: |
          find release-artifacts -type f \
            \( -name '*.deb' -o -name '*.zip' -o -name '*.dmg' \) \
            -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                sha256sum "${file}" | sed "s|  .*|  ${file##*/}|"
              done > release-artifacts/SHA256SUMS.txt
      - name: Publish GitHub release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = context.ref.replace('refs/tags/', '');
            const files = [];
            const visit = (directory) => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const target = path.join(directory, entry.name);
                if (entry.isDirectory()) visit(target);
                else if (/\.(deb|zip|dmg)$/.test(entry.name) || entry.name === 'SHA256SUMS.txt') files.push(target);
              }
            };
            visit('release-artifacts');
            if (files.length < 7) {
              throw new Error('Expected Linux and macOS installers plus checksums.');
            }
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Infinite Wall ${tag}`,
                generate_release_notes: true,
                draft: false,
                prerelease: tag.includes('-'),
              }));
            }
            for (const file of files) {
              const name = path.basename(file);
              const existing = release.assets.find((asset) => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(file),
              });
            }
